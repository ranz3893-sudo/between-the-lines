
media:
  input: media
  output: /media

content:
  - name: poems
    label: Poems
    type: collection
    path: content/poems
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      primary: title
      fields: [title, date, published]
      sort: date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Poem Title
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
      - name: published
        label: Published
        type: boolean
      - name: body
        label: Your Poem
        type: rich-text

  - name: reflections
    label: Reflections
    type: collection
    path: content/reflections
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      primary: title
      fields: [title, date, published]
      sort: date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Reflection Title
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
      - name: published
        label: Published
        type: boolean
      - name: body
        label: Your Reflection
        type: rich-text
        
