
media:
  input: media
  output: /media


content:
  - name: poems
    label: Poems
    type: collection
    path: content/poems
    fields:
      - name: title
        label: Poem Title
        type: string
      - name: date
        label: Date
        type: date
      - name: published
        label: Published
        type: boolean
      - name: body
        label: Your Poem
        type: rich-text

  - name: reflections
    label: Reflections
    type: collection
    path: content/reflections
    fields:
      - name: title
        label: Reflection Title
        type: string
      - name: date
        label: Date
        type: date
      - name: published
        label: Published
        type: boolean
      - name: body
        label: Your Reflection
        type: rich-text
        

